name: semantic-quality

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run quality
        env:
          # Shared-runner CPU allocation is not a stable timing reference.
          # Other semantic and structural performance budgets remain strict.
          SEMATH_BUDGET_TIMING_GATE: "0"
