name: semantic-quality

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: sha256sum -c SHA256SUMS
        working-directory: lib/wasm
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: scripts/build-wasm.sh
      - run: git diff --exit-code -- lib/wasm
      - run: bun run conservative
      - run: bun run quality
        env:
          # Individual shared-runner samples are noisy. The stable-budget
          # wrapper still enforces the frozen five-sample timing medians.
          SEMATH_BUDGET_TIMING_GATE: "0"
