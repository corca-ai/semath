name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bun run typecheck
      - run: bun test
      - run: bun run pack:conformance
      - run: bun run calibration:v0.11
      - run: sha256sum -c SHA256SUMS
        working-directory: lib/wasm
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: scripts/build-wasm.sh
      - run: node scripts/check-parity.mjs
      - run: bun run budget:v0.8
      - run: bun run budget:v0.9
      - run: bun run budget:v0.10
      - run: bun run budget:v0.11
      - run: bun run package:smoke
      - run: git diff --exit-code -- lib/wasm/semath_wasm.js lib/wasm/semath_wasm.d.ts lib/wasm/semath_wasm_bg.wasm.d.ts
